name: Docs

# Versioned documentation, generated from docstrings with MkDocs Material +
# mkdocstrings and published to GitHub Pages with mike. Every release tag
# gets its own /X.Y.Z/ URL; /latest/ always points to the newest release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish docs for (e.g. 0.3.0)'
        required: true

permissions:
  contents: write  # mike pushes to the gh-pages branch

jobs:
  deploy:
    name: Build and publish versioned docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # mike needs the gh-pages history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install docs tooling
        # mkdocstrings analyzes src/ statically, so the package (and
        # concrete-python) does not need to be installed.
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material "mkdocstrings[python]" mike mkdocs-jupyter

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
