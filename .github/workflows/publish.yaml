name: Publish to PyPI

# Triggered by version tags only. Creating a GitHub Release for an
# already-pushed tag does NOT retrigger publishing, so tag + release
# no longer produce duplicate uploads.
on:
  push:
    tags:
      - 'v*'

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing için gereklidir

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheels and source tarball
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes re-runs idempotent: files already on PyPI are skipped
          # instead of failing the run with "400 File already exists".
          skip-existing: true
