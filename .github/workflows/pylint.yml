name: Pylint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Run Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          # Projenizin bağımlılıkları varsa Pylint'in import hataları vermemesi için yüklüyoruz:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Analysing the code with pylint
        run: |
          # Proje dizinindeki tüm .py dosyalarını tarar
          # Note: --fail-under=5.0 belirlenen skorun altına düşerse pipeline'ı başarısız sayar.
          pylint $(git ls-files '*.py') --fail-under=5.0
