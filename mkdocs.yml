site_name: concrete-fhe-toolkit
site_description: Bounded math helpers for compiling common Zama Concrete FHE circuits
site_url: https://tolgabuyuktanir.github.io/concrete-fhe-toolkit/
repo_url: https://github.com/tolgabuyuktanir/concrete-fhe-toolkit
repo_name: tolgabuyuktanir/concrete-fhe-toolkit

theme:
  name: material
  icon:
    logo: material/lock
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/zama.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            show_signature_annotations: true
            separate_signature: true

extra:
  version:
    provider: mike

markdown_extensions:
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: README.md
  - Guides:
      - Bounds and costs: bounds-and-costs.md
      - API usage guide: api-reference.md
      - Testing and release: testing-and-release.md
  - Tutorials:
      - Arithmetic: tutorials/01_arithmetic.ipynb
      - Arrays: tutorials/02_arrays.ipynb
      - Statistics: tutorials/03_stats.ipynb
      - Math (Basic): tutorials/04_math_basic.ipynb
      - Math (Binary Division): tutorials/05_math_binary_division.ipynb
      - Math (Bits): tutorials/06_math_bits.ipynb
      - Math (Combinatorics): tutorials/07_math_combinatorics.ipynb
      - Math (Fixed Point): tutorials/08_math_fixed_point.ipynb
      - Math (Number Theory): tutorials/09_math_number_theory.ipynb
      - Math (Special): tutorials/10_math_special.ipynb
      - Finance (Core): tutorials/11_finance_core.ipynb
      - Finance (Transactions): tutorials/12_finance_transactions.ipynb
      - ML (Activations): tutorials/13_ml_activations.ipynb
      - ML (Core): tutorials/17_ml_core.ipynb
  - API reference:
      - Overview: api/index.md
      - Core:
          - Arithmetic: api/arithmetic.md
          - Arrays: api/arrays.md
          - Statistics: api/stats.md
          - Privacy (DP): api/privacy.md
          - Deployment: api/deploy.md
      - Math:
          - Basic operations: api/math-basic.md
          - Combinatorics: api/math-combinatorics.md
          - Number theory: api/math-number-theory.md
          - Fixed point: api/math-fixed-point.md
          - Special functions: api/math-special.md
          - Bit primitives: api/math-bits.md
          - Binary division: api/math-binary-division.md
      - Machine learning:
          - Base Classes: api/ml-classes.md
          - Metrics and losses: api/ml-core.md
          - Models: api/ml-models.md
          - Trainers (encrypted training): api/ml-trainers.md
          - Pipelines: api/ml-pipeline.md
          - Preprocessing: api/ml-preprocessing.md
          - Serialization: api/ml-serialization.md
          - sklearn bridge: api/ml-sklearn-bridge.md
          - Cost estimation: api/ml-estimation.md
          - Clustering: api/ml-clustering.md
          - Matrix algebra: api/ml-matrix.md
          - Activations: api/ml-activations.md
          - Statistics: api/ml-stats.md
          - Preprocessing: api/ml-utils.md
      - Finance:
          - Rates and interest: api/finance-core.md
          - Transactions: api/finance-transactions.md
