[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-fhe-toolkit"
version = "0.3.0"
description = "Bounded math helpers for compiling common Concrete FHE circuits"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Erkan Işık Bacak" },
  { name = "Tolga Büyüktanır" },
  { name = "Yücel Pehlevan" },
  { name = "Muharrem Uğurelli" },
]
keywords = [
  "concrete",
  "fhe",
  "homomorphic-encryption",
  "math",
  "privacy",
  "cryptography",
  "fixed-point",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "concrete-python>=2.11,<3",
  "numpy>=1.23,<2",
  # concrete-python currently imports pkg_resources at runtime.
  "setuptools<81",
]

[project.urls]
Company = "https://www.agrafintech.com"
Homepage = "https://github.com/tolgabuyuktanir/concrete-fhe-toolkit"
Repository = "https://github.com/tolgabuyuktanir/concrete-fhe-toolkit"
Documentation = "https://tolgabuyuktanir.github.io/concrete-fhe-toolkit/"
"Example notebook" = "https://www.kaggle.com/code/erkankbacak/concrete-fhe-toolkit-test"
"Math notebook" = "https://www.kaggle.com/code/erkankbacak/concrete-math-library"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
dev = [
  "build>=1.2",
  "pytest>=8,<10",
  "twine>=5",
]
docs = [
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.26",
  "mike>=2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concrete_fhe_toolkit = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Start with correctness-focused rules; widen once the codebase is clean.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  # Builtin shadowing is intentional in the math subpackage (abs, divmod,
  # round, pow-style names mirror Python's math module).
  "F811",
]

[tool.ruff.lint.per-file-ignores]
# __init__ files re-export the public API.
"src/concrete_fhe_toolkit/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "fhe: performs real encrypted execution and may take several minutes",
]
